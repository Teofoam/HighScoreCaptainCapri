name: Daily Problem Pusher

on:
  schedule:
    # 每天北京时间早上 8:00 执行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  push-to-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ⬆️ 升级 1：使用最新版 v4

      - name: Setup Python
        uses: actions/setup-python@v5 # ⬆️ 升级 1：使用最新版 v5
        with:
          python-version: '3.10'
          cache: 'pip' # ⚡ 升级 2：开启 pip 缓存，加快运行速度

      - name: Install Dependencies
        # 📦 升级 3：规范化依赖安装
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run the Python Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python push.py