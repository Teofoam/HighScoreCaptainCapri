name: Daily Problem Pusher

on:
  schedule:
    # 每天北京时间早上 8:00 执行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击运行
    inputs:
      daily_count:
        description: '今天总共推几道题'
        default: '10'
      generated_count:
        description: '其中来自生成器（数电/模电）的道数'
        default: '3'

jobs:
  push-problems:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install CJK fonts # 渲染题目卡片里的中文
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium # KaTeX 渲染用的无头浏览器
        run: python -m playwright install --with-deps chromium

      - name: Push daily problems
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 定时触发时 inputs 为空，回落到默认值
          DAILY_COUNT: ${{ inputs.daily_count || '10' }}
          GENERATED_COUNT: ${{ inputs.generated_count || '3' }}
        run: python push.py
